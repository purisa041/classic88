<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สปีด-เทค // คลังอะไหล่ JDM แท้ 50 รายการ</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanline"></div>
    
    <header>
        <div class="logo">
            <span>湾岸</span> SPEED-TECH <span class="badge">JDM 50 ITEMS</span>
        </div>
        <nav>
            <a href="#" class="active">คลังอะไหล่</a>
            <a href="#" id="cart-btn">ตะกร้าสินค้า (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="container">
        <section class="search-section">
            <h1 class="glitch-text">คลังอะไหล่แต่ง JDM (50 รายการ)</h1>
            
            <div class="model-buttons">
                <button class="btn-model active" onclick="filterModel('all')">ทั้งหมด (50)</button>
                <button class="btn-model" onclick="filterModel('skyline')">NISSAN (GT-R / SILVIA)</button>
                <button class="btn-model" onclick="filterModel('supra')">TOYOTA (SUPRA / AE86)</button>
                <button class="btn-model" onclick="filterModel('honda')">HONDA (CIVIC / INTEGRAL)</button>
                <button class="btn-model" onclick="filterModel('impreza')">SUBARU (WRX / STI)</button>
                <button class="btn-model" onclick="filterModel('rx7')">MAZDA (RX-7 / RX-8)</button>
                <button class="btn-model" onclick="filterModel('universal')">UNIVERSAL (ล้อ/เบาะ/วัดรอบ)</button>
            </div>
        </section>

        <section class="product-grid" id="product-container"></section>
    </main>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>// ตะกร้าสินค้าและการชำระเงิน</h2>
            
            <div id="cart-items" class="cart-items-list">
                <p class="empty-msg">ไม่มีสินค้าในตะกร้า</p>
            </div>

            <div class="cart-total">
                <span>ราคารวมทั้งหมด:</span>
                <span id="total-price" class="total-amount">฿ 0</span>
            </div>

            <form id="checkout-form" onsubmit="processOrder(event)">
                <h3>// ข้อมูลและที่อยู่สำหรับจัดส่ง</h3>
                <div class="input-group">
                    <input type="text" id="cust-name" placeholder="ชื่อ-นามสกุล ผู้รับ" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="cust-phone" placeholder="เบอร์โทรศัพท์ติดต่อ" required>
                </div>
                <div class="input-group">
                    <textarea id="cust-address" rows="3" placeholder="ที่อยู่จัดส่งอย่างละเอียด" required></textarea>
                </div>
                <button type="submit" class="btn-checkout">ยืนยันการสั่งซื้อ // สั่งซื้อทันที</button>
            </form>
        </div>
    </div>

    <footer>
        <p>SPEED-TECH คลังอะไหล่ JDM แท้ // โตเกียว - กรุงเทพฯ // ก่อตั้งปี 1999</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
